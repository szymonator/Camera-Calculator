<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Calculator</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1e1e1e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        #equation-display {
            font-size: 3rem;
            font-family: monospace;
            min-height: 60px;
            margin-bottom: 20px;
            color: #00ffcc;
        }
        .video-container {
            position: relative;
            height: 65vh; 
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block;
        }
        
        video {
            height: 100%;
            width: auto;
            display: block;
            transform: scaleX(-1);
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>Gesture Calculator</h1>
    
    <div id="equation-display">=</div>

    <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script src="calculator.js"></script>
    <script type="module" src="app.js"></script>

</body>
</html>
