<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Calculator</title>

    <!-- fun pixel font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: sans-serif;
            background-color: #1e1e1e;
            color: white;
            margin: 0;
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly; 
            padding: 2vh 0; 
            box-sizing: border-box;
        }
        .video-container {
            will-change: contents;
            transform: translateZ(0);
            position: relative;
            
            height: auto;
            max-height: 50vh; 
            width: auto;
            max-width: 90vw;
            aspect-ratio: 16 / 9;
            
            background-color: #0a0a0a;
            display: flex; 
            

            border: 30px solid #2a2c2e;
            border-radius: 40px; 
            
            overflow: hidden;
        }


        #lcd-container {
            background-color: #0d2b26;
            padding: 10px 40px;
            border-radius: 8px;
            border: 3px solid #000; 
            margin: 0;
            min-width: 50vw;
            width: fit-content;
            height: 100px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        #equation-display {
            font-family: "Bitcount Grid Single", system-ui;
            font-optical-sizing: auto;
            font-weight: 350;
            font-style: normal;
            font-size: 4rem;
            margin: 0; 
            color: #00ffcc;
            text-shadow: 0px 0px 8px rgba(0, 255, 204, 0.4); 
        }

        .header {
            font-family: "Bitcount Grid Single", system-ui;
            font-optical-sizing: auto;
            font-weight: 350;
            font-style: normal;
            font-size: 4rem;
            margin: 0; 
            color: #00ffcc;
            text-shadow: 0px 0px 8px rgba(0, 255, 204, 0.4); 
        }

        .help-btn {
            position: fixed; top: 20px; left: 20px;
            width: 70px; height: 70px; border-radius: 50%;
            z-index: 100;
            background-color: #0d2b26;
            border: 3px solid #000; 
            margin: 0;

            font-family: "Bitcount Grid Single", system-ui;
            font-optical-sizing: auto;
            font-weight: 350;
            font-style: normal;
            font-size: 2rem;
            margin: 0; 
            color: #00ffcc;
            text-shadow: 0px 0px 8px rgba(0, 255, 204, 0.4);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        #help-window::backdrop {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(1px);
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scaleX(-1);
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 10;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas" class="bg-video"></canvas>

    <button popovertarget="help-window" class="help-btn">?</button>

    <div id="help-window" popover>
        <h2>How to Use</h2>
        <p>Gesture 1: ...</p>
        <p>Gesture 2: ...</p>
    </div>

<h1 class="header">Gesture Calculator</h1>
    
    <div id="lcd-container">
        <h1 id="equation-display">Click ? for help!</h1>
    </div>
    

    <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script type="module" src="calculator.js"></script>
    <script type="module" src="app.js"></script>

</body>
</html>
